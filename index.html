<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>中正國中 3D 校園導覽</title>
<meta name="robots" content="noindex">
<style>
  :root{--bg:#f4f7f5;--ink:#14263a;--muted:#55677a;--accent:#1667b7}
  @media (prefers-color-scheme:dark){:root{--bg:#0e1a22;--ink:#e6eef2;--muted:#93a6b3;--accent:#5fb0ff}}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
  main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;box-sizing:border-box;text-align:center}
  h1{font-size:20px;margin:0}
  p{margin:0;color:var(--muted);font-size:14px}
  a{color:var(--accent);font-weight:700}
</style>
<main>
  <h1>中正國中 3D 校園導覽</h1>
  <p>正在開啟地圖…</p>
  <p><a id="go" href="#">沒有自動跳轉請按這裡</a></p>
</main>
<script>
/* 轉址頁：把這個短網址後面帶的參數，原封不動轉給 Google Apps Script 的網頁。
   GAS 網址換了，只要改下面這一行，印出去的連結和 QR Code 都不用重做。 */
var GAS_URL = 'https://script.google.com/macros/s/AKfycbywHUAVNsVKFqf7Ck7O4MN48qhLobw1CCzRf6f-q6SUQLX6b2KqpUKhGSxVhQkomoClxA/exec';

(function(){
  var q = location.search.replace(/^\?/, '');
  var h = location.hash.replace(/^#/, '');
  // 舊式的 # 連結也接受：#r128、#nav~G01~128、#e-活動代號
  if (!q && h) {
    var m;
    if ((m = h.match(/^nav~(.+)$/))) { var a = m[1].split('~'); q = 'from=' + a[0] + '&to=' + a[1] + (a.length > 2 ? '&via=' + a.slice(2).join(',') : ''); }
    else if ((m = h.match(/^e-(.+)$/))) q = 'event=' + m[1];
    else if ((m = h.match(/^r(.+)$/))) q = 'to=' + m[1];
  }
  // 短寫法：?e=活動代號 等同 ?event=
  q = q.replace(/(^|&)e=/, '$1event=');
  var url = GAS_URL + (q ? '?' + q : '');
  document.getElementById('go').href = url;
  location.replace(url);
})();
</script>
