<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>中正國中 3D 校園導覽</title>
<meta name="robots" content="noindex">
<style>
  :root{--bg:#f4f7f5;--ink:#14263a;--muted:#55677a;--accent:#1667b7}
  @media (prefers-color-scheme:dark){:root{--bg:#0e1a22;--ink:#e6eef2;--muted:#93a6b3;--accent:#5fb0ff}}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
  main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;box-sizing:border-box;text-align:center}
  h1{font-size:20px;margin:0} p{margin:0;color:var(--muted);font-size:14px} a{color:var(--accent);font-weight:700}
</style>
<main>
  <h1>中正國中 3D 校園導覽</h1>
  <p>網址已搬家，正在開啟地圖…</p>
  <p><a id="go" href="https://zhengxuetech.github.io/ccjhs-map/">沒有自動跳轉請按這裡</a></p>
</main>
<script>
/* 舊網址（ccjhsmaker）轉址頁：已貼出的 QR 牌、寄出的班級／會議連結都還指向這裡。
   這裡只做一件事：把網址後面的參數（?from=G01、?e=代號…）和 # 原封不動轉到新網址。
   這個檔以後不用再改；備援開關、地圖更新都在新儲存庫做。 */
var NEW_URL = 'https://zhengxuetech.github.io/ccjhs-map/';
var url = NEW_URL + location.search + location.hash;
document.getElementById('go').href = url;
location.replace(url);
</script>
